<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kirill Balloon CRM</title><meta name="theme-color" content="#111317"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Balloon CRM"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#111317;--panel:#1d2026;--border:#30343b;--text:#f3f2ef;--muted:#9da2ac;--gold:#d9b877}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:20px;margin:0;letter-spacing:.4px}h2{font-size:21px;margin:22px 0 14px}h3{font-size:16px;margin:8px 0}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:11px;padding:11px 14px;background:#292d34;color:var(--text)}button.primary{background:var(--gold);color:#18191c;border-color:var(--gold);font-weight:700}button.flat{background:transparent;border:0;color:var(--gold)}button.danger{color:#f5a9a9}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:16px;margin:11px 0}.card.click{cursor:pointer}.card.click:hover{border-color:#807053}.pill{font-size:12px;padding:5px 8px;border-radius:7px;background:#34332c;color:#e9ce94}nav{position:fixed;bottom:0;left:0;right:0;background:#181a1f;border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:var(--muted);flex:1;max-width:180px;font-size:13px}nav button.active{color:var(--gold)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}input,select,textarea{background:#15171b;color:var(--text);border:1px solid #41454c;border-radius:9px;padding:12px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--gold)}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>div{min-width:0}.grid input,.grid select{min-width:0;max-width:100%;display:block}@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}.line{border-top:1px solid var(--border);margin:18px 0}.total{font-size:24px;color:var(--gold);font-weight:700}.item{padding:12px 0;border-bottom:1px solid var(--border)}.thumb{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:10px 2px;min-height:47px;text-align:center;border-radius:8px;background:#22252b;border:1px solid transparent}.day.selected{border-color:var(--gold)}.day.has{color:var(--gold)}.day.blank{background:transparent}.notice{border-left:3px solid var(--gold);padding-left:12px}.hidden{display:none}@media(max-width:430px){.grid{grid-template-columns:minmax(0,1fr)}main{padding:20px 14px 100px}.card{padding:14px}}
</style></head><body><main><header><div><h1>KIRILL <span style="color:var(--gold)">BALLOON</span></h1><small>Личная CRM · PWA 0.2.0</small></div><button class="primary" onclick="newOrder()">+ Заказ</button></header><div id="app"></div></main><nav id="nav"></nav><script>
const KEY='kirill_balloon_demo_v1';const uid=()=>globalThis.crypto?.randomUUID?.()||('order-'+Date.now()+'-'+Math.random().toString(36).slice(2));const storage={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v);return true}catch(e){alert('Браузер не разрешает локальное сохранение. Открой приложение в обычном Safari.');return false}}};let db=JSON.parse(storage.get()||'{"orders":[],"clients":[]}'),page='home',editing=null,selectedDate=new Date().toISOString().slice(0,10),month=new Date().toISOString().slice(0,7);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' ₽',save=()=>storage.set(JSON.stringify(db));function nav(){ $('nav').innerHTML=['home:Главная','calendar:Календарь','clients:Клиенты','settings:Настройки'].map(x=>{let [k,v]=x.split(':');return `<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`}).join('')}function go(p){page=p;editing=null;render()}function render(){nav();let a=$('app');if(page==='home'){let sorted=[...db.orders].sort((a,b)=>a.date.localeCompare(b.date));a.innerHTML=`<h2>Ближайшие заказы</h2><div class="row between"><small>${db.orders.length} заказов в прототипе</small><button onclick="newOrder()">+ Добавить</button></div>${sorted.length?sorted.map(orderCard).join(''):'<div class="card muted">Пока нет заказов. Создай первый тестовый заказ.</div>'}<h2>Напоминания</h2><div class="card muted">В прототипе напоминания отображаются внутри заказов. Push-уведомления пока не отправляются.</div>`}else if(page==='calendar')calendar();else if(page==='clients')clients();else if(page==='settings')a.innerHTML=`<h2>Настройки прототипа</h2><div class="card notice">Данные пока хранятся в localStorage браузера этого устройства. Облака и авторизации нет. Перед использованием реальных данных проверь резервное копирование и восстановление. Не удаляй данные Safari без сохранённой копии.</div><div class="card"><button onclick="exportData()">Скачать резервную копию (JSON)</button><p><label for="backupInput">Восстановить из резервной копии</label><input id="backupInput" type="file" accept=".json,application/json" onchange="importData(this)"></p><small>Восстановление заменит текущую базу только после подтверждения. Храни копию вне Safari, например в «Файлах» или iCloud Drive.</small><p><button class="danger" onclick="resetData()">Удалить все тестовые данные</button></p></div>`;else if(page==='form')form();else if(page==='detail')detail()}
function orderCard(o){return `<div class="card click" onclick="openOrder('${o.id}')"><div class="row between"><strong>${esc(o.date)} · ${esc(o.time||'Время не указано')}</strong><span class="pill">${esc(o.prep||'Не начата')}</span></div><h3>${esc(o.client||'Без имени')}</h3><div class="muted">${esc(o.address||'Адрес не указан')}</div><div class="row between" style="margin-top:12px"><span>${money(total(o))}</span><small>${esc(o.type==='delivery'?'Доставка':'Оформление')}</small></div></div>`}function total(o){return (o.items||[]).reduce((s,i)=>s+(i.mode==='unit'?Number(i.qty||0)*Number(i.price||0):Number(i.price||0)),0)}function paid(o){return (o.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0)}function newOrder(){editing={id:uid(),date:new Date().toISOString().slice(0,10),time:'',ready:'',type:'delivery',address:'',client:'',phone:'',items:[{name:'',mode:'fixed',qty:1,price:''}],payments:[],prep:'Не начата',comment:'',reminders:[],photos:[]};page='form';render()}function openOrder(id){editing=db.orders.find(o=>o.id===id);page='detail';render()}function editOrder(){editing=structuredClone(editing);page='form';render()}function detail(){let o=editing;if(!o)return go('home');$('app').innerHTML=`<div class="row between"><button onclick="go('home')">← Назад</button><button class="primary" onclick="editOrder()">Редактировать</button></div><h2>${esc(o.client||'Заказ')}</h2><div class="card"><p><strong>Дата:</strong> ${esc(o.date)} · ${esc(o.time)}</p>${o.ready?`<p><strong>Готовность:</strong> ${esc(o.ready)}</p>`:''}<p><strong>Адрес:</strong> ${esc(o.address)}</p><p><strong>Телефон:</strong> ${esc(o.phone)}</p><p><strong>Тип:</strong> ${o.type==='delivery'?'Доставка':'Оформление'}</p></div><h3>Состав</h3><div class="card">${(o.items||[]).map(i=>`<div class="row between item"><span>${esc(i.name)} ${i.mode==='unit'?'('+esc(i.qty)+' шт.)':''}</span><strong>${money(i.mode==='unit'?Number(i.qty)*Number(i.price):i.price)}</strong></div>`).join('')}<p class="row between"><strong>Итого</strong><span class="total">${money(total(o))}</span></p><p>Получено: ${money(paid(o))} · Остаток: ${money(total(o)-paid(o))}</p><p>Подготовка: ${esc(o.prep)}</p></div><h3>Комментарии</h3><div class="card">${esc(o.comment)||'<span class="muted">Нет комментария</span>'}</div><h3>Напоминания</h3><div class="card">${(o.reminders||[]).map(r=>`<p>${esc(r.date)} · ${esc(r.text)}</p>`).join('')||'<span class="muted">Не добавлены</span>'}</div><h3>Фотографии</h3><div class="card row">${(o.photos||[]).map(p=>`<img class="thumb" src="${p}" alt="Фото заказа">`).join('')||'<span class="muted">Не добавлены</span>'}</div>`}
function form(){let o=editing;$('app').innerHTML=`<div class="row between"><button onclick="go('home')">← Назад</button><span class="muted">${db.orders.some(x=>x.id===o.id)?'Редактирование':'Новый заказ'}</span></div><h2>Детали заказа</h2><div class="card"><label>Тип заказа</label><select id="type" onchange="readForm();render()"><option value="delivery" ${o.type==='delivery'?'selected':''}>Доставка</option><option value="setup" ${o.type==='setup'?'selected':''}>Оформление на площадке</option></select><div class="grid"><div><label>Дата</label><input id="date" type="date" value="${esc(o.date)}"></div><div><label>${o.type==='setup'?'Заезд':'Время доставки'}</label><input id="time" type="time" value="${esc(o.time)}"></div></div>${o.type==='setup'?`<label>Время готовности (необязательно)</label><input id="ready" type="time" value="${esc(o.ready)}">`:''}<label>Адрес</label><input id="address" value="${esc(o.address)}" placeholder="Куда ехать"><label>Имя клиента</label><input id="client" value="${esc(o.client)}" placeholder="Имя"><label>Телефон / контакт</label><input id="phone" value="${esc(o.phone)}" placeholder="Телефон или мессенджер"></div><h2>Состав заказа</h2><div id="items"></div><button onclick="readForm();editing.items.push({name:'',mode:'fixed',qty:1,price:''});render()">+ Добавить позицию</button><div class="card row between"><strong>Итого</strong><strong class="total" id="total">${money(total(o))}</strong></div><h2>Оплата</h2><div id="payments"></div><button onclick="readForm();editing.payments.push({amount:'',date:new Date().toISOString().slice(0,10)});render()">+ Добавить платёж</button><div class="card"><div class="row between"><span>Получено</span><strong id="paid">${money(paid(o))}</strong></div><div class="row between" style="margin-top:10px"><span>Остаток</span><strong id="balance">${money(total(o)-paid(o))}</strong></div></div><h2>Подготовка</h2><div class="card"><select id="prep">${['Не начата','Закупка материалов','В подготовке','Готов к монтажу','Выполнен','Отменён'].map(x=>`<option ${o.prep===x?'selected':''}>${x}</option>`).join('')}</select></div><h2>Напоминания (внутри CRM)</h2><div id="reminders"></div><button onclick="readForm();editing.reminders.push({date:'',text:''});render()">+ Напоминание</button><h2>Комментарий</h2><textarea id="comment" placeholder="Особые условия, демонтаж и т. п.">${esc(o.comment)}</textarea><h2>Фотографии</h2><div class="card"><input type="file" id="photosInput" accept="image/*" multiple onchange="addPhotos(this)"><div class="row" style="margin-top:12px">${(o.photos||[]).map((p,i)=>`<div><img class="thumb" src="${p}" alt="Фото"><br><button class="flat" onclick="removePhoto(${i})">Удалить</button></div>`).join('')}</div><small>Для тестирования используйте небольшие изображения. Файлы хранятся только в браузере.</small></div><div class="row" style="margin-top:22px"><button class="primary" style="flex:1" onclick="saveOrder()">Сохранить заказ</button>${db.orders.some(x=>x.id===o.id)?'<button class="danger" onclick="deleteOrder()">Удалить</button>':''}</div>`;drawItems();drawPayments();drawReminders()}
function drawItems(){$('items').innerHTML=editing.items.map((i,n)=>`<div class="card"><div class="row between"><strong>Позиция ${n+1}</strong><button class="flat danger" onclick="readForm();editing.items.splice(${n},1);render()">Удалить</button></div><label>Наименование</label><input data-item="${n}" data-field="name" value="${esc(i.name)}" placeholder="Например, фотозона" oninput="recalc()"><label>Расчёт</label><select data-item="${n}" data-field="mode" onchange="readForm();render()"><option value="fixed" ${i.mode==='fixed'?'selected':''}>Общая стоимость</option><option value="unit" ${i.mode==='unit'?'selected':''}>Количество × цена</option></select><div class="grid">${i.mode==='unit'?`<div><label>Количество</label><input type="number" min="0" step="1" data-item="${n}" data-field="qty" value="${esc(i.qty)}" oninput="recalc()"></div>`:''}<div><label>${i.mode==='unit'?'Цена за единицу':'Стоимость, ₽'}</label><input type="number" min="0" data-item="${n}" data-field="price" value="${esc(i.price)}" oninput="recalc()"></div></div></div>`).join('')}function drawPayments(){$('payments').innerHTML=editing.payments.map((p,n)=>`<div class="card row"><div style="flex:1"><label>Сумма, ₽</label><input type="number" min="0" data-payment="${n}" data-field="amount" value="${esc(p.amount)}" oninput="recalc()"></div><div style="flex:1"><label>Дата</label><input type="date" data-payment="${n}" data-field="date" value="${esc(p.date)}"></div><button class="flat danger" onclick="readForm();editing.payments.splice(${n},1);render()">×</button></div>`).join('')}function drawReminders(){$('reminders').innerHTML=editing.reminders.map((r,n)=>`<div class="card"><div class="row between"><strong>Напоминание</strong><button class="flat danger" onclick="readForm();editing.reminders.splice(${n},1);render()">Удалить</button></div><label>Дата и время</label><input type="datetime-local" data-reminder="${n}" data-field="date" value="${esc(r.date)}"><label>Текст</label><input data-reminder="${n}" data-field="text" value="${esc(r.text)}" placeholder="Например, проверить логотип"></div>`).join('')}
function readForm(){let o=editing;for(let k of ['type','date','time','ready','address','client','phone','prep','comment']){let e=$(k);if(e)o[k]=e.value}document.querySelectorAll('[data-item]').forEach(e=>o.items[+e.dataset.item][e.dataset.field]=e.value);document.querySelectorAll('[data-payment]').forEach(e=>o.payments[+e.dataset.payment][e.dataset.field]=e.value);document.querySelectorAll('[data-reminder]').forEach(e=>o.reminders[+e.dataset.reminder][e.dataset.field]=e.value)}function recalc(){readForm();$('total').textContent=money(total(editing));$('paid').textContent=money(paid(editing));$('balance').textContent=money(total(editing)-paid(editing))}function saveOrder(){readForm();if(!editing.date){alert('Укажи дату');return}let idx=db.orders.findIndex(x=>x.id===editing.id);if(idx>=0)db.orders[idx]=structuredClone(editing);else db.orders.push(structuredClone(editing));save();page='home';editing=null;render()}function deleteOrder(){if(confirm('Удалить этот заказ?')){db.orders=db.orders.filter(o=>o.id!==editing.id);save();go('home')}}function removePhoto(i){readForm();editing.photos.splice(i,1);render()}async function addPhotos(inp){readForm();for(let f of inp.files){if(f.size>2e6){alert('Для прототипа выбери фото меньше 2 МБ');continue}let url=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});editing.photos.push(url)}render()}
function calendar(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),count=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7,days=Array(offset).fill('<div class="day blank"></div>');for(let d=1;d<=count;d++){let date=`${month}-${String(d).padStart(2,'0')}`,has=db.orders.some(o=>o.date===date);days.push(`<button class="day ${has?'has':''} ${selectedDate===date?'selected':''}" onclick="selectedDate='${date}';render()">${d}${has?' •':''}</button>`)}$('app').innerHTML=`<div class="row between"><button onclick="shiftMonth(-1)">←</button><h2>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><button onclick="shiftMonth(1)">→</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<small style="text-align:center">${x}</small>`).join('')}${days.join('')}</div><h2>Заказы · ${esc(selectedDate)}</h2>${db.orders.filter(o=>o.date===selectedDate).map(orderCard).join('')||'<div class="card muted">Заказов нет</div>'}`}function shiftMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.toISOString().slice(0,7);render()}function clients(){let map=new Map();db.orders.forEach(o=>{let k=(o.phone||o.client||o.id).trim().toLowerCase();if(!map.has(k))map.set(k,[]);map.get(k).push(o)});$('app').innerHTML=`<h2>Клиенты</h2><small>Список формируется из сохранённых заказов</small>${[...map.values()].map(arr=>`<div class="card"><strong>${esc(arr[0].client||'Без имени')}</strong><p class="muted">${esc(arr[0].phone||'Контакт не указан')} · Заказов: ${arr.length}</p>${arr.map(o=>`<button onclick="openOrder('${o.id}')">${esc(o.date)} · ${money(total(o))}</button>`).join(' ')}</div>`).join('')||'<div class="card muted">Клиентов пока нет</div>'}`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kirill-balloon-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Удалить все тестовые заказы?')){db={orders:[],clients:[]};save();render()}}
async function importData(inp){
 const file=inp.files&&inp.files[0];if(!file)return;
 try{
  if(file.size>25*1024*1024)throw Error('Файл слишком большой (максимум 25 МБ).');
  const parsed=JSON.parse(await file.text());
  if(!parsed||!Array.isArray(parsed.orders)||!Array.isArray(parsed.clients))throw Error('Неверный формат резервной копии.');
  if(parsed.orders.some(o=>!o||typeof o!=='object'||typeof o.id!=='string'||!Array.isArray(o.items)||!Array.isArray(o.payments)||!Array.isArray(o.reminders)||!Array.isArray(o.photos)))throw Error('Некорректные данные заказов.');
  if(!confirm('Восстановление заменит ВСЕ текущие заказы и клиентов данными из файла. Продолжить?')){inp.value='';return}
  const previous=db;db=parsed;
  if(!save()){db=previous;throw Error('Не удалось сохранить восстановленные данные. Возможно, закончилось место в браузере.');}
  alert('Резервная копия восстановлена. Заказов: '+db.orders.length);render();
 }catch(e){alert('Не удалось восстановить копию: '+e.message)}finally{inp.value=''}
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Офлайн-режим не активирован:',e)))}
render();
</script></body></html>
